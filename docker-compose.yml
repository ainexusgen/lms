services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms123
      POSTGRES_DB: lmsdb
    ports:
      - "5433:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lmsdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://lms:lms123@db:5432/lmsdb
      JWT_SECRET: demo-secret-change-me
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8020
    ports:
      - "3020:3000"
    depends_on:
      - backend

volumes:
  lms_pgdata:
